<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSUKURIDANOSU | 作リだノス</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400;700;900&family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'deep-black': '#0A0A0A',
              'intense-red': '#E60000',
              'silver': '#F5F5F5',
              'charcoal': '#1A1A1A',
            },
            fontFamily: {
              serif: ['"Noto Serif JP"', 'serif'],
              display: ['"Syncopate"', 'sans-serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      html {
        scroll-padding-top: 100px; /* Offset for fixed header */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0A; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E60000; 
      }

      /* Vertical Text Utilities */
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      /* Glitch Effect Classes */
      .glitch-hover {
        position: relative;
        overflow: hidden;
      }
      .glitch-hover::before {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0A0A0A;
        left: -2px;
        text-shadow: 1px 0 #E60000;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
        display: none;
      }
      .glitch-hover:hover::before {
        display: block;
      }
      @keyframes glitch-anim {
        0% { clip: rect(12px, 9999px, 32px, 0); }
        5% { clip: rect(64px, 9999px, 80px, 0); }
        10% { clip: rect(10px, 9999px, 85px, 0); }
        15% { clip: rect(40px, 9999px, 12px, 0); }
        20% { clip: rect(80px, 9999px, 5px, 0); }
        25% { clip: rect(15px, 9999px, 60px, 0); }
        30% { clip: rect(55px, 9999px, 30px, 0); }
        35% { clip: rect(10px, 9999px, 90px, 0); }
        40% { clip: rect(95px, 9999px, 10px, 0); }
        45% { clip: rect(30px, 9999px, 50px, 0); }
        50% { clip: rect(70px, 9999px, 20px, 0); }
        100% { clip: rect(0, 9999px, 0, 0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-deep-black text-silver overflow-x-hidden antialiased">

  <script type="module" src="/index.tsx"></script>
</body>
</html>
